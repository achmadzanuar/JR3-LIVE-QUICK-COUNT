<!doctype html><html><head><meta charset="utf-8"><title>JR3 audit UI tests · synthetic data</title></head><body><h1>Audit UI tests — synthetic data only</h1><button id="run">Run end-to-end UI checks</button><pre id="report"></pre><iframe id="audit" src="/analisis" style="width:100%;height:1000px"></iframe><script type="module">
const frame=document.getElementById('audit'),report=document.getElementById('report');
const pause=()=>new Promise(r=>setTimeout(r,80));
async function until(predicate){for(let i=0;i<100;i++){if(predicate())return;await pause();}throw Error('Timed out');}
function assert(value,message){if(!value)throw Error(message);report.textContent+='PASS '+message+'\n';}
document.getElementById('run').onclick=async()=>{report.textContent='';try{
  const win=frame.contentWindow,doc=frame.contentDocument,$=id=>doc.getElementById(id),input=(id,text)=>{$(id).value=text;$(id).dispatchEvent(new Event('input',{bubbles:true}));},submit=id=>$(id).requestSubmit();
  win.confirm=()=>true;
  if($('login-panel').hidden){$('logout').click();await until(()=>!$('login-panel').hidden);}
  input('login-password','incorrect');submit('login-form');await until(()=>$('notice').textContent.includes('tidak sesuai'));assert(!$('login-panel').hidden,'wrong password stays locked');
  input('login-password','JR3 audit browser test only');submit('login-form');await until(()=>$('login-panel').hidden);assert(!$('workspace').hidden,'login opens private workspace');
  $('new-audit').click();await until(()=>!$('audit-content').hidden);assert($('stats').textContent.includes('Total respons27'),'source snapshot shows 27 synthetic responses');assert($('finalize').disabled,'unresolved response disables finalization');assert(!$('unsaved').hidden,'new snapshot has unsaved indicator');
  doc.querySelector('[data-theme-choice=dark]').click();assert(doc.documentElement.dataset.theme==='dark','dark theme works');doc.querySelector('[data-theme-choice=light]').click();
  assert($('response-rows').textContent.includes('Responden Uji A'),'respondent name appears in private table');input('search','responden uji b');assert($('visible-count').textContent==='1 dari 27 respons','respondent name search works');input('search','');
  const compare=id=>$('response-rows').querySelector('[aria-label="Bandingkan respons #'+id+'"]');
  $('status-filter').value='duplicate';$('status-filter').dispatchEvent(new Event('change'));compare(3).click();await until(()=>$('comparison-dialog').open);
  assert($('comparison-rows').children.length===3,'comparison includes all three house responses despite duplicate filter');
  assert($('comparison-rows').querySelector('[data-response="2"]').textContent.includes('Dihitung · 1 poin'),'counted response remains visible as reference');
  assert($('comparison-rows').querySelector('[data-response="3"]').classList.contains('comparison-selected'),'selected duplicate is highlighted');
  assert($('comparison-rows').querySelector('[data-response="3"]').textContent.includes('Nama berbeda')&&$('comparison-rows').querySelector('[data-response="3"]').textContent.includes('Pilihan berbeda'),'name and candidate differences are informational');
  assert($('comparison-rows').textContent.includes('Alamat rumah sama')&&$('comparison-rows').textContent.includes('XI/5')&&$('comparison-rows').textContent.includes('11/05'),'raw address variants and normalized equality shown');
  assert($('comparison-rows').textContent.includes('000 WIB'),'comparison time includes milliseconds');
  $('close-comparison').click();await until(()=>!$('comparison-dialog').open);
  $('status-filter').value='';$('status-filter').dispatchEvent(new Event('change'));$('next-page').click();assert($('page-info').textContent==='Halaman 2 / 2','pagination fixture reaches second page');
  compare(40).click();await until(()=>$('comparison-dialog').open);assert($('comparison-rows').querySelector('[data-response="2"]'),'comparison retrieves counted reference from another page');assert($('comparison-explanation').textContent.includes('sama persis')&&$('comparison-explanation').textContent.includes('baris #2'),'exact timestamp tie explains source row order');
  $('close-comparison').click();await until(()=>!$('comparison-dialog').open);await pause();assert(doc.activeElement===compare(40),'closing panel returns keyboard focus to its trigger');
  $('duplicate-groups').querySelector('button').click();await until(()=>$('comparison-dialog').open);assert($('comparison-rows').children.length===3,'house group button opens full comparison');
  $('comparison-rows').querySelector('[data-response="2"] button').click();await until(()=>$('decision-dialog').open);$('decision-action').value='reject';$('decision-action').dispatchEvent(new Event('change'));input('decision-reason','Penolakan sintetis untuk uji pembanding');submit('decision-form');await until(()=>!$('decision-dialog').open);
  compare(3).click();await until(()=>$('comparison-dialog').open);assert($('comparison-reference').textContent.includes('#40 yang dihitung'),'rejecting earliest response updates counted reference');assert($('comparison-rows').querySelector('[data-response="2"]').textContent.includes('Ditolak panitia · 0 poin'),'comparison retains rejected same-house response');
  $('comparison-rows').querySelector('[data-response="2"] button').click();await until(()=>$('decision-dialog').open);$('decision-action').value='reset';$('decision-action').dispatchEvent(new Event('change'));input('decision-reason','Pulihkan keputusan sintetis');submit('decision-form');await until(()=>!$('decision-dialog').open);
  compare(3).click();await until(()=>$('comparison-dialog').open);$('comparison-rows').querySelector('[data-response="40"] button').click();await until(()=>$('decision-dialog').open);input('decision-address','IV/11A');input('decision-reason','Koreksi alamat sintetis');submit('decision-form');await until(()=>!$('decision-dialog').open);
  compare(3).click();await until(()=>$('comparison-dialog').open);assert($('comparison-rows').children.length===2&&!$('comparison-rows').querySelector('[data-response="40"]'),'address correction removes response from previous duplicate group');$('close-comparison').click();await until(()=>!$('comparison-dialog').open);
  compare(5).click();await until(()=>$('comparison-dialog').open);const corrected=$('comparison-rows').querySelector('[data-response="40"]');assert(corrected.cells[3].textContent==='Blok 11 No. 5'&&corrected.cells[4].textContent.includes('IV/11A')&&corrected.cells[5].textContent.includes('Blok 4 · Rumah 11A'),'comparison shows original, corrected and normalized addresses separately');corrected.querySelector('button').click();await until(()=>$('decision-dialog').open);$('decision-action').value='reset';$('decision-action').dispatchEvent(new Event('change'));input('decision-reason','Pulihkan alamat sintetis');submit('decision-form');await until(()=>!$('decision-dialog').open);
  $('status-filter').value='review';$('status-filter').dispatchEvent(new Event('change'));assert($('visible-count').textContent==='1 dari 27 respons','status filter shows one review');
  $('response-rows').querySelector('button').click();await until(()=>$('decision-dialog').open);input('decision-address','IV/11B');input('decision-reason','Alamat sintetis dikonfirmasi untuk pengujian');submit('decision-form');await until(()=>!$('decision-dialog').open);assert(!$('finalize').disabled,'address correction resolves review');assert($('history').textContent.includes('Alamat sintetis dikonfirmasi'),'history renders reason');
  $('status-filter').value='';$('status-filter').dispatchEvent(new Event('change'));input('search','XI/5');assert($('visible-count').textContent==='1 dari 27 respons','address search works');input('search','');
  let saved=null;win.HTMLAnchorElement.prototype.click=function(){if(this.download)saved={url:this.href,name:this.download};};
  $('save-audit').click();await until(()=>$('password-dialog').open);input('file-password','JR3 audit browser test only');submit('password-form');await until(()=>saved!==null&&!$('unsaved').hidden===false);assert(saved.name.includes('draft'),'draft download generated');assert($('unsaved').hidden,'export clears unsaved marker');
  const bytes=await (await fetch(saved.url)).blob();const encrypted=await bytes.text();assert(!encrypted.includes('XI/5'),'download does not expose plaintext addresses');
  const transfer=new DataTransfer();transfer.items.add(new File([bytes],'test.jr3audit'));$('file-input').files=transfer.files;$('file-input').dispatchEvent(new Event('change'));await until(()=>$('password-dialog').open);input('file-password','JR3 audit browser test only');submit('password-form');await until(()=>$('notice').textContent.includes('terverifikasi'));assert($('document-status').textContent.includes('DRAF'),'draft import verifies server signature');
  saved=null;$('finalize').click();await until(()=>$('password-dialog').open);input('file-password','JR3 audit browser test only');submit('password-form');await until(()=>saved!==null);assert($('document-status').textContent==='FINAL TERKUNCI','final locked label');assert(!$('response-rows').querySelector('.review-button'),'final response rows cannot edit');assert(saved.name.includes('final'),'final encrypted download generated');
  compare(3).click();await until(()=>$('comparison-dialog').open);assert(!$('comparison-rows').querySelector('button')&&$('comparison-rows').textContent.includes('Arsip final · hanya baca'),'final archive comparison is read-only');$('close-comparison').click();await until(()=>!$('comparison-dialog').open);
  $('revise').click();await until(()=>$('document-status').textContent.includes('VERSI 2'));assert($('source-info').textContent.includes('Revisi final'),'revision references final');assert($('response-rows').querySelector('.review-button'),'revision re-enables review');
  report.textContent+='DONE: all UI checks passed';
}catch(error){report.textContent+='FAIL '+error.stack;}};
</script></body></html>
